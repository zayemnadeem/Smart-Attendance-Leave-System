{% extends "base.html" %}
{% block title %}Apply Leave{% endblock %}

{% block content %}
<section class="card narrow">
    <h2>Apply for Leave</h2>
    <p class="muted">Leave requests are full-day only. Approved leave marks all 7 periods as Excused.</p>
    <form method="POST" action="{{ url_for('apply_leave') }}" class="form">
        <label for="date">Leave Date</label>
        <input type="date" name="date" id="date" required />

        <label for="reason">Reason</label>
        <textarea name="reason" id="reason" rows="4" required placeholder="Enter reason for leave"></textarea>

        <button type="submit">Submit Leave Request</button>
    </form>
    <a href="{{ url_for('student_dashboard') }}" class="text-link">Back to Dashboard</a>
</section>
{% endblock %}
